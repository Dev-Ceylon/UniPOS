name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unipos/db generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @unipos/core test:coverage
      - run: pnpm --filter @unipos/web test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: packages/core/coverage
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true

  integration:
    name: Integration (Postgres, RLS, sync) + migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unipos_shadow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unipos/db generate
      - name: Migration diff (schema.prisma matches migrations)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE unipos_shadow"
          pnpm --filter @unipos/db migrate:diff
      - run: pnpm test:integration

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [checks]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://unipos_app:unipos_app@localhost:5432/unipos
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unipos
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE unipos"
          psql "$MIGRATE_DATABASE_URL" -f packages/db/prisma/sql/setup-roles.sql
          pnpm --filter @unipos/db generate
          pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @unipos/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
